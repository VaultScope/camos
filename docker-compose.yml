services:
  vaultscope-admin:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /var/run:uid=101,gid=101,mode=0755,noexec,nosuid,nodev
      - /tmp:uid=101,gid=101,mode=0755,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
